name: robot-control-rpi

x-ros-service: &ros-service
  image: robot-control-rpi:latest
  network_mode: host
  # Fast DDS can otherwise select shared-memory transport while Docker keeps
  # each container in a different IPC namespace.
  ipc: host
  restart: unless-stopped
  init: true
  environment:
    ROS_DISTRO: "humble"
    ROS_DOMAIN_ID: "20"
    # DDS stays host-local; Zenoh is the only cross-host ROS transport.
    ROS_LOCALHOST_ONLY: "1"
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  agent:
    image: microros/micro-ros-agent:humble
    container_name: robot-microros-agent
    network_mode: host
    ipc: host
    restart: unless-stopped
    init: true
    # The agent is the only process that owns the MCU serial port. base_node
    # communicates with it over ROS 2 and must not open the same device.
    privileged: true
    environment:
      ROS_DOMAIN_ID: "20"
      ROS_LOCALHOST_ONLY: "1"
    devices:
      - "${ROBOT_SERIAL_DEVICE:-/dev/ttyUSB0}:/dev/robot-controller"
    volumes:
      - /dev/shm:/dev/shm
    command:
      - serial
      - --dev
      - /dev/robot-controller
      - -b
      - "${ROBOT_SERIAL_BAUD:-921600}"
      - -v4
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # TCP ROS transport for UTM Shared/NAT deployments. Port 7448 is dedicated
  # to the active compute server; the old 7447 endpoint must not be shared by
  # two compute servers because duplicate /cmd_vel and sensor writers result.
  ros-transport:
    image: ${ZENOH_BRIDGE_IMAGE:-eclipse/zenoh-bridge-ros2dds:latest}
    container_name: robot-ros-transport
    network_mode: host
    ipc: host
    restart: unless-stopped
    init: true
    environment:
      ROS_DISTRO: "humble"
      ROS_DOMAIN_ID: "20"
      ROS_LOCALHOST_ONLY: "1"
    volumes:
      - ./zenoh/robot-transport.json5:/etc/zenoh/transport.json5:ro
    command: ["-c", "/etc/zenoh/transport.json5"]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  base:
    <<: *ros-service
    container_name: robot-base-node
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: yahboomtechnology/ros-humble:4.1.2
    # Official Yahboom startup. This includes the base processing and the
    # scan/odom relay/fix nodes used by the MS200 LiDAR pipeline. The raw
    # radar data still originates on the micro-ROS control board.
    command: ["bringup"]
    depends_on:
      - agent

  bridge:
    <<: *ros-service
    container_name: robot-command-bridge
    command: ["bridge"]
    depends_on:
      - agent
    volumes:
      - ./maps:/opt/robot-control/maps
      - ./robot_cmd_bridge.py:/opt/robot-control/robot_cmd_bridge.py:ro
      # mapping_start가 왔는데 mapping-runtime이 안 떠 있으면 브릿지가
      # mapping_runtime_launcher.py(호스트에서 systemd로 별도 실행, docker
      # 그룹 권한)에게 이 소켓 하나로만 "mapping-runtime 띄워줘"를 요청한다.
      # docker.sock을 직접 물리지 않는 이유: 그러면 브릿지 컨테이너가 호스트
      # 도커 전체를 조작할 수 있게 되어, 통제 브릿지 하나가 뚫리면 로봇
      # 호스트까지 뚫리는 셈이 된다. 이 소켓은 "그 컨테이너 하나 시작" 이상은
      # 아무것도 못 하도록 런처 쪽에서 액션을 하드코딩해 좁혀둔다.
      - ./mapping_launcher.sock:/run/mapping_launcher.sock
    environment:
      ROS_DOMAIN_ID: "20"
      ROS_LOCALHOST_ONLY: "1"
      MAPPING_LAUNCHER_SOCKET: "/run/mapping_launcher.sock"
      # Keep the command bridge on the image-default FastDDS implementation.
      # With ROS_LOCALHOST_ONLY=1, CycloneDDS disables multicast on loopback
      # and the bridge cannot discover mapping-runtime in another container.
      # The image-wide DYNAMIC_REUSABLE FastDDS profile now handles the
      # variable-size Zenoh action responses that originally motivated the
      # CycloneDDS override.
      SERVER_COMMAND_TIMEOUT_SEC: "0.5"
      SERVER_MAX_LINEAR_SPEED: "0.12"
      SERVER_MIN_LINEAR_SPEED: "0.04"
      SERVER_MAX_ANGULAR_SPEED: "0.18"
      SERVER_MIN_ANGULAR_SPEED: "0.18"
      SERVER_PURE_ROTATION_LINEAR_EPSILON: "0.01"
      SERVER_DRIVING_ANGULAR_DEADBAND: "0.03"
      # Frontier clustering can take several seconds once a classroom map is
      # large. Velocity commands still expire independently after 0.5 s, so a
      # longer ownership lease prevents false release without allowing stale
      # motion to continue.
      NAVIGATION_LEASE_TIMEOUT_SEC: "10.0"

  camera:
    <<: *ros-service
    container_name: robot-camera-stream
    command: ["camera"]
    privileged: true
    volumes:
      - /dev:/dev
      - /dev/shm:/dev/shm
      - ./camera_stream_server.py:/opt/robot-control/camera_stream_server.py:ro

  # Always-on apple quality inspection. The camera service remains the only
  # owner of /dev/video0; this node consumes its ROS image topic and publishes
  # normal/damaged detections for the stream overlay and Android status UI.
  apple-detect:
    <<: *ros-service
    container_name: robot-apple-detect
    restart: always
    entrypoint: ["bash", "/opt/robot-control/apple/apple_detection_entrypoint.sh"]
    command: []
    volumes:
      - ./apple_detection_node.py:/opt/robot-control/apple/apple_detection_node.py:ro
      - ./apple_detection_entrypoint.sh:/opt/robot-control/apple/apple_detection_entrypoint.sh:ro
      - "${APPLE_MODEL_HOST_PATH:-../apple_defect_detection/apple_defect_v5_local.pt}:/opt/robot-control/apple/apple_defect_v5_local.pt:ro"
    environment:
      ROS_DISTRO: "humble"
      ROS_DOMAIN_ID: "20"
      ROS_LOCALHOST_ONLY: "1"
      APPLE_MODEL_PATH: "/opt/robot-control/apple/apple_defect_v5_local.pt"
      APPLE_CAMERA_TOPIC: "${APPLE_CAMERA_TOPIC:-/camera/image_raw}"
      APPLE_CONFIDENCE: "${APPLE_CONFIDENCE:-0.65}"
      APPLE_IOU: "${APPLE_IOU:-0.45}"
      APPLE_IMGSZ: "${APPLE_IMGSZ:-320}"
      APPLE_MIN_INTERVAL_SEC: "${APPLE_MIN_INTERVAL_SEC:-0.8}"
    depends_on:
      - camera

  # Low obstacles and network command expiry must be handled on the robot,
  # even when SLAM/Nav2 run on an external compute server.
  camera-safety:
    <<: *ros-service
    container_name: robot-camera-safety
    command: ["camera-safety"]
    depends_on:
      - camera

  # The Arduino sketch owns the HX711, the 2.8 g classification rule and
  # the sorting servo. This read-only bridge only translates its 9600-baud USB
  # Serial output into the existing ROS loadcell topics.
  loadcell:
    <<: *ros-service
    container_name: robot-loadcell-guard
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: yahboomtechnology/ros-humble:4.1.2
    entrypoint: ["/opt/robot-control/arduino_loadcell_entrypoint.sh"]
    command: []
    devices:
      - "${ROBOT_LOADCELL_SERIAL_DEVICE:-/dev/serial/by-id/usb-FIREPHX_USB_SER_FX2348N-if00}:/dev/loadcell-arduino"
    volumes:
      - ./arduino_loadcell_bridge.py:/opt/robot-control/navigation/arduino_loadcell_bridge.py:ro
      - ./arduino_loadcell_entrypoint.sh:/opt/robot-control/arduino_loadcell_entrypoint.sh:ro
    environment:
      ROS_DOMAIN_ID: "20"
      ROS_LOCALHOST_ONLY: "1"
      ROBOT_LOADCELL_SERIAL_DEVICE: "/dev/loadcell-arduino"
      ROBOT_LOADCELL_SERIAL_BAUD: "9600"
      ROBOT_LOADCELL_LOW_THRESHOLD_G: "0.8"
      ROBOT_LOADCELL_HIGH_THRESHOLD_G: "2.8"

  # Explicit profile: YOLO person detection publishes to /person_detection but
  # never touches /cmd_vel by itself -- follow-runtime is the one that moves.
  person-detect:
    <<: *ros-service
    container_name: robot-person-detect
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: yahboomtechnology/ros-humble:4.1.2
    command: ["person-detect"]
    profiles: [follow]
    environment:
      ROS_DOMAIN_ID: "20"
      ROS_LOCALHOST_ONLY: "1"
      FOLLOW_CAMERA_TOPIC: "${FOLLOW_CAMERA_TOPIC:-/camera/image_raw}"
    depends_on:
      - camera

  # Explicit profile: never starts following during a normal boot. Same
  # reasoning as mapping-runtime -- a voice command must call
  # /follow_person/start before the robot will move toward anyone
  # (enabled=False by default in follow_person.py).
  follow-runtime:
    <<: *ros-service
    container_name: robot-follow-runtime
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: yahboomtechnology/ros-humble:4.1.2
    command: ["follow"]
    profiles: [follow]
    environment:
      ROS_DOMAIN_ID: "20"
      ROS_LOCALHOST_ONLY: "1"
      FOLLOW_LINEAR_SPEED: "${FOLLOW_LINEAR_SPEED:-0.2}"
      FOLLOW_ANGULAR_SPEED: "${FOLLOW_ANGULAR_SPEED:-0.4}"
    depends_on:
      - agent
      - base
      - person-detect

  # Explicit profile: never starts autonomous mapping during a normal boot.
  # The explorer itself also waits for /autonomous_mapping/start.
  mapping-runtime:
    <<: *ros-service
    container_name: robot-mapping-runtime
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: yahboomtechnology/ros-humble:4.1.2
    command: ["mapping"]
    restart: "no"
    profiles: [mapping]
    environment:
      ROS_DOMAIN_ID: "20"
      ROS_LOCALHOST_ONLY: "1"
      ROBOT_MAP_OUTPUT: "${ROBOT_MAP_OUTPUT:-/opt/robot-control/maps/orchard_map}"
      ROBOT_MAPPING_MAXIMUM_RUNTIME: "${ROBOT_MAPPING_MAXIMUM_RUNTIME:-1800.0}"
      ROBOT_MAPPING_MAXIMUM_RADIUS: "${ROBOT_MAPPING_MAXIMUM_RADIUS:-12.0}"
    depends_on:
      - agent
      - base
      - camera-safety
    volumes:
      - ./maps:/opt/robot-control/maps

  # Created only after the first map exists. Once created, Docker's
  # unless-stopped policy brings it back automatically after every reboot.
  navigation-runtime:
    <<: *ros-service
    container_name: robot-navigation-runtime
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: yahboomtechnology/ros-humble:4.1.2
    command: ["navigation"]
    profiles: [navigation]
    depends_on:
      - agent
      - base
      - camera
    volumes:
      - ./maps:/opt/robot-control/maps:ro
