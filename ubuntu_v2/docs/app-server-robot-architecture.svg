<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="1470" viewBox="0 0 2100 1470" role="img" aria-labelledby="title desc">
  <title id="title">OrX 실제 배포 기준 시스템 아키텍처</title>
  <desc id="desc">Android 앱, Ubuntu 서버의 로봇 제어·음성·웹·PostgreSQL·SQLite·지도 저장소, Raspberry Pi 로봇 사이의 실제 데이터 흐름과 보안 경계</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FBF7"/><stop offset="1" stop-color="#EEF4FC"/></linearGradient>
    <linearGradient id="appHead" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#166534"/><stop offset="1" stop-color="#22C55E"/></linearGradient>
    <linearGradient id="serverHead" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1E3A8A"/><stop offset="1" stop-color="#2563EB"/></linearGradient>
    <linearGradient id="robotHead" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9A3412"/><stop offset="1" stop-color="#F97316"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.12"/></filter>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L10 5 L0 10 Z" fill="#2563EB"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L10 5 L0 10 Z" fill="#16A34A"/></marker>
    <marker id="orangeArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L10 5 L0 10 Z" fill="#EA580C"/></marker>
    <marker id="purpleArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L10 5 L0 10 Z" fill="#7C3AED"/></marker>
    <style>
      text { font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; fill: #172033; }
      .panel-title { font-size: 31px; font-weight: 850; fill: #FFFFFF; } .panel-sub { font-size: 16px; font-weight: 650; fill: #EAF2FF; }
      .section { font-size: 16px; font-weight: 850; letter-spacing: .5px; } .card-title { font-size: 19px; font-weight: 850; }
      .body { font-size: 15px; font-weight: 560; } .small { font-size: 13px; font-weight: 560; } .tiny { font-size: 12px; font-weight: 560; }
      .label { font-size: 14px; font-weight: 800; } .muted { fill: #667085; }
    </style>
  </defs>
  <rect width="2100" height="1470" fill="url(#bg)"/><circle cx="1960" cy="110" r="240" fill="#FFEDD5" opacity=".35"/><circle cx="100" cy="1340" r="270" fill="#DCFCE7" opacity=".34"/>
  <text x="1050" y="56" text-anchor="middle" font-size="38" font-weight="900" fill="#10243C">OrX 실제 배포 기준 시스템 아키텍처</text>
  <text x="1050" y="88" text-anchor="middle" font-size="16" font-weight="650" class="muted">Android · Ubuntu Server · Raspberry Pi 5 | 코드·Docker·운영 DB 대조본 (2026-08-21)</text>

  <!-- Android -->
  <g filter="url(#shadow)"><rect x="40" y="125" width="460" height="1110" rx="24" fill="#FFFFFF" stroke="#86C99B" stroke-width="2"/><path d="M64 125 H476 Q500 125 500 149 V225 H40 V149 Q40 125 64 125 Z" fill="url(#appHead)"/></g>
  <text x="72" y="171" class="panel-title">① Android 앱</text><text x="72" y="202" class="panel-sub">Robot Companion · Java 17 · 로컬 네트워크</text>
  <rect x="70" y="258" width="400" height="128" rx="15" fill="#F0FDF4" stroke="#86EFAC"/><text x="94" y="292" class="card-title" fill="#166534">사용자 인터페이스</text><text x="94" y="323" class="body">수동 운전 · 긴급 정지 · Follow Me</text><text x="94" y="351" class="body">음성 명령 · 지도/홈 · 연결/적재 상태</text><text x="94" y="375" class="small" fill="#166534">FOLLOW / GO_HOME은 사용자 확인 후 실행</text>
  <rect x="70" y="408" width="400" height="168" rx="15" fill="#F8FAFC" stroke="#CBD5E1"/><text x="94" y="442" class="card-title">네트워크 클라이언트</text><text x="94" y="473" class="body">TCP :9999 · JSON Lines 제어/상태</text><text x="94" y="501" class="body">HTTP :10000 · 4초 WAV 음성 요청</text><text x="94" y="529" class="body">HTTP :80 · 계정 생성/로그인 API</text><text x="94" y="557" class="body">HTTP :8080 · 로봇 MJPEG 직접 표시</text>
  <rect x="70" y="598" width="400" height="142" rx="15" fill="#F8FAFC" stroke="#CBD5E1"/><text x="94" y="632" class="card-title">로컬 상태·보안</text><text x="94" y="663" class="body">로그인 여부/사용자명만 SharedPreferences</text><text x="94" y="691" class="body">제어 토큰은 Android Keystore AES-GCM</text><text x="94" y="719" class="body">서버 IP · 속도 · 로봇 주소 설정</text>
  <rect x="70" y="762" width="400" height="140" rx="15" fill="#F5F3FF" stroke="#C4B5FD"/><text x="94" y="796" class="card-title" fill="#6D28D9">음성 명령 안전 게이트</text><text x="94" y="827" class="body">기다려 · 멈춰 · 따라와 · 집으로 가</text><text x="94" y="855" class="body">서버가 허용 목록 의도만 반환</text><text x="94" y="883" class="small">앱이 결과를 TCP 명령으로 다시 전송</text>
  <rect x="70" y="924" width="400" height="112" rx="15" fill="#ECFDF3" stroke="#A7F3D0"/><text x="94" y="958" class="card-title" fill="#166534">영상·Follow 역할</text><text x="94" y="989" class="body">앱: MJPEG 표시와 시작/중지 명령</text><text x="94" y="1017" class="body">사람 탐지·추종 추론은 로봇에서 수행</text>
  <rect x="70" y="1060" width="400" height="142" rx="15" fill="#FFF7ED" stroke="#FDBA74"/><text x="94" y="1093" class="card-title" fill="#9A3412">클라이언트 안전 동작</text><text x="94" y="1124" class="body">100 ms heartbeat · 자동 재연결</text><text x="94" y="1152" class="body">백그라운드/연결 해제 시 안전 정지</text><text x="94" y="1180" class="small">앱은 ROS 2와 PostgreSQL에 직접 접속하지 않음</text>

  <!-- Ubuntu Server -->
  <g filter="url(#shadow)"><rect x="650" y="125" width="800" height="1245" rx="24" fill="#FFFFFF" stroke="#8DB4F8" stroke-width="2"/><path d="M674 125 H1426 Q1450 125 1450 149 V225 H650 V149 Q650 125 674 125 Z" fill="url(#serverHead)"/></g>
  <text x="684" y="171" class="panel-title">② Ubuntu 서버</text><text x="684" y="202" class="panel-sub">Docker · 제어/AI plane + 웹/계정 plane + 영속 데이터</text>
  <text x="684" y="263" class="section" fill="#1D4ED8">ROBOT CONTROL PLANE · host network</text>
  <rect x="680" y="282" width="354" height="148" rx="15" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/><text x="704" y="316" class="card-title" fill="#1D4ED8">robot-v2-gateway · :9999</text><text x="704" y="347" class="body">제어 토큰 검증 · 명령/상태 중계</text><text x="704" y="375" class="body">MAC/mDNS 로봇 IP 탐색 · 재연결</text><text x="704" y="403" class="body">속도 제한 · heartbeat · 지도 묶음 전송</text>
  <rect x="1056" y="282" width="364" height="148" rx="15" fill="#F8FAFC" stroke="#CBD5E1"/><text x="1080" y="316" class="card-title">Operations SQLite3</text><text x="1080" y="347" class="body">robot_state · robot_events</text><text x="1080" y="375" class="body">work_sessions · metadata · WAL</text><text x="1080" y="403" class="small">소유자: gateway · bind mount ./data</text><path d="M1034 356 H1056" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#blueArrow)"/>
  <rect x="680" y="454" width="740" height="125" rx="15" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/><text x="704" y="488" class="card-title" fill="#6D28D9">voice-command · :10000 + whisper.cpp</text><text x="704" y="519" class="body">다국어 Whisper small 전사 · 16 kHz mono WAV 검증</text><text x="704" y="547" class="body">방언 alias 정확 일치 → WAIT / STOP / FOLLOW / GO_HOME</text><text x="1395" y="547" text-anchor="end" class="small" fill="#6D28D9">로봇과 직접 통신하지 않음</text>
  <rect x="680" y="603" width="232" height="134" rx="15" fill="#F8FAFC" stroke="#CBD5E1"/><text x="704" y="637" class="card-title">지도 파일 저장소</text><text x="704" y="668" class="body">raw / corrected / current</text><text x="704" y="696" class="body">PGM/YAML + pose + checksum</text><text x="704" y="721" class="small">bind mount ./maps</text>
  <rect x="934" y="603" width="486" height="134" rx="15" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/><text x="958" y="637" class="card-title" fill="#6D28D9">map-postprocessor · network_mode: none</text><text x="958" y="668" class="body">노이즈 제거 · 벽 각도/짧은 끊김 보정 · 품질 검증</text><text x="958" y="696" class="body">지도와 pose에 동일 affine · 검증본만 원자 승격</text><text x="958" y="721" class="small">외부 네트워크 차단 · 공유 maps 볼륨만 사용</text><path d="M912 670 H934" fill="none" stroke="#7C3AED" stroke-width="3" marker-end="url(#purpleArrow)"/>
  <text x="684" y="785" class="section" fill="#0369A1">WEB / ACCOUNT PLANE · Docker public + internal private network</text>
  <rect x="680" y="808" width="214" height="142" rx="15" fill="#ECFEFF" stroke="#67E8F9"/><text x="704" y="842" class="card-title" fill="#0369A1">Nginx Web · :80</text><text x="704" y="873" class="body">정적 사이트 · /api proxy</text><text x="704" y="901" class="body">외부 공개 포트</text><text x="704" y="929" class="small">요청 제한 · 보안 헤더</text>
  <rect x="920" y="808" width="228" height="142" rx="15" fill="#ECFEFF" stroke="#67E8F9"/><text x="944" y="842" class="card-title" fill="#0369A1">Spring WAS · :8080</text><text x="944" y="873" class="body">회원가입/로그인</text><text x="944" y="901" class="body">도입 문의 API · BCrypt</text><text x="944" y="929" class="small">호스트 포트 미공개</text>
  <rect x="1174" y="808" width="246" height="142" rx="15" fill="#EFF6FF" stroke="#93C5FD"/><text x="1198" y="842" class="card-title" fill="#1D4ED8">PostgreSQL 17 · :5432</text><text x="1198" y="873" class="body">users · inquiries</text><text x="1198" y="901" class="body">flyway_schema_history</text><text x="1198" y="929" class="small">private network 전용 · orchardx_db</text><path d="M894 879 H920" fill="none" stroke="#0EA5E9" stroke-width="3" marker-end="url(#blueArrow)"/><path d="M1148 879 H1174" fill="none" stroke="#0EA5E9" stroke-width="3" marker-end="url(#blueArrow)"/>
  <rect x="680" y="975" width="740" height="96" rx="15" fill="#FEFCE8" stroke="#FDE047"/><text x="704" y="1009" class="card-title" fill="#854D0E">데이터 소유권 분리</text><text x="704" y="1040" class="body">PostgreSQL = 사용자/문의 · SQLite = 로봇 가용성/세션 · maps = 지도 파일</text><text x="704" y="1061" class="small">서로 직접 조인하지 않으며 각 서비스 API/볼륨으로만 접근</text>
  <rect x="680" y="1095" width="740" height="112" rx="15" fill="#FFF7ED" stroke="#FDBA74"/><text x="704" y="1129" class="card-title" fill="#9A3412">노출·격리 경계</text><text x="704" y="1160" class="body">공개: 80, 9999, 10000 · 내부 전용: 8080, 5432</text><text x="704" y="1188" class="body">제어/음성 토큰 공용 · DB 비밀번호 별도 · 로그 rotation</text>
  <rect x="680" y="1230" width="740" height="108" rx="15" fill="#FEE2E2" stroke="#FCA5A5"/><text x="704" y="1264" class="card-title" fill="#991B1B">현재 보안 부채</text><text x="704" y="1295" class="body">HTTP/TCP가 평문이므로 신뢰된 LAN에서만 사용</text><text x="704" y="1323" class="small">운영 외부망 전환 전 TLS reverse proxy/VPN 및 MJPEG 인증 필요</text>

  <!-- Robot -->
  <g filter="url(#shadow)"><rect x="1600" y="125" width="460" height="1110" rx="24" fill="#FFFFFF" stroke="#FDBA74" stroke-width="2"/><path d="M1624 125 H2036 Q2060 125 2060 149 V225 H1600 V149 Q1600 125 1624 125 Z" fill="url(#robotHead)"/></g>
  <text x="1632" y="171" class="panel-title">③ 실물 로봇</text><text x="1632" y="202" class="panel-sub">Raspberry Pi 5 · ROS 2 Humble · Domain 20</text>
  <rect x="1630" y="258" width="400" height="135" rx="15" fill="#FFF7ED" stroke="#FDBA74"/><text x="1654" y="292" class="card-title" fill="#C2410C">Command Bridge · :9999</text><text x="1654" y="323" class="body">명령 임대 · 최종 속도 제한 · motor owner</text><text x="1654" y="351" class="body">LiDAR/카메라 freshness · 비상정지</text><text x="1654" y="379" class="small">로드셀/지도/Nav/Follow 상태를 같은 응답에 포함</text>
  <rect x="1630" y="416" width="400" height="135" rx="15" fill="#F8FAFC" stroke="#CBD5E1"/><text x="1654" y="450" class="card-title">자율주행·매핑 runtime</text><text x="1654" y="481" class="body">SLAM Toolbox · Nav2 · Frontier 탐색</text><text x="1654" y="509" class="body">home pose · 지도 저장/복구</text><text x="1654" y="537" class="small">프로필 기반 시작 · mapping launcher 소켓</text>
  <rect x="1630" y="574" width="400" height="135" rx="15" fill="#F8FAFC" stroke="#CBD5E1"/><text x="1654" y="608" class="card-title">카메라·사람 추적</text><text x="1654" y="639" class="body">MJPEG Camera Server · :8080</text><text x="1654" y="667" class="body">YOLO person detect → Follow runtime</text><text x="1654" y="695" class="small">추론과 /cmd_vel_follow 생성은 로봇 내부</text>
  <rect x="1630" y="732" width="400" height="112" rx="15" fill="#FFF7ED" stroke="#FDBA74"/><text x="1654" y="766" class="card-title" fill="#C2410C">로드셀 가드</text><text x="1654" y="797" class="body">HX711 → Pi5 GPIO · tare/calibration</text><text x="1654" y="825" class="small">ROS status → Command Bridge → TCP :9999</text>
  <rect x="1630" y="867" width="400" height="93" rx="15" fill="#FFF7ED" stroke="#FDBA74"/><text x="1830" y="901" text-anchor="middle" class="card-title">ROS 2 DDS · localhost only</text><text x="1830" y="931" text-anchor="middle" class="small">/scan · /odom · /tf · /cmd_vel · /loadcell/* · actions</text><path d="M1830 960 V994" fill="none" stroke="#EA580C" stroke-width="3" marker-end="url(#orangeArrow)"/>
  <rect x="1630" y="1008" width="400" height="80" rx="15" fill="#FFF7ED" stroke="#FDBA74"/><text x="1830" y="1041" text-anchor="middle" class="card-title">micro-ROS Agent + Base Node</text><text x="1830" y="1069" text-anchor="middle" class="small">USB Serial 921600 bps · agent 단독 소유</text><path d="M1830 1088 V1117" fill="none" stroke="#EA580C" stroke-width="3" marker-end="url(#orangeArrow)"/>
  <rect x="1630" y="1131" width="400" height="71" rx="15" fill="#FFEDD5"/><text x="1830" y="1161" text-anchor="middle" class="card-title" fill="#9A3412">ESP32 + Hardware</text><text x="1830" y="1187" text-anchor="middle" class="small">LiDAR · IMU · Encoder · Motor · Servo · Camera</text>

  <!-- Inter-system flows -->
  <path d="M500 465 H628 V338 H680" fill="none" stroke="#2563EB" stroke-width="4" marker-end="url(#blueArrow)"/><rect x="510" y="300" width="128" height="58" rx="12" fill="#EFF6FF" stroke="#BFDBFE"/><text x="574" y="323" text-anchor="middle" class="label" fill="#1D4ED8">TCP :9999</text><text x="574" y="345" text-anchor="middle" class="tiny">명령 ↔ 전체 상태</text>
  <path d="M500 500 H616 V516 H680" fill="none" stroke="#7C3AED" stroke-width="4" marker-end="url(#purpleArrow)"/><rect x="510" y="521" width="150" height="58" rx="12" fill="#F5F3FF" stroke="#DDD6FE"/><text x="585" y="544" text-anchor="middle" class="label" fill="#6D28D9">HTTP :10000</text><text x="585" y="566" text-anchor="middle" class="tiny">WAV → intent 응답</text>
  <path d="M500 535 H590 V879 H680" fill="none" stroke="#0EA5E9" stroke-width="4" marker-end="url(#blueArrow)"/><rect x="510" y="792" width="138" height="58" rx="12" fill="#ECFEFF" stroke="#A5F3FC"/><text x="579" y="815" text-anchor="middle" class="label" fill="#0369A1">HTTP :80</text><text x="579" y="837" text-anchor="middle" class="tiny">회원가입/로그인</text>
  <path d="M1420 338 H1578 V326 H1630" fill="none" stroke="#2563EB" stroke-width="4" marker-end="url(#blueArrow)"/><path d="M1630 370 H1580 V390 H1420" fill="none" stroke="#2563EB" stroke-width="4" marker-end="url(#blueArrow)"/><rect x="1464" y="270" width="124" height="58" rx="12" fill="#EFF6FF" stroke="#BFDBFE"/><text x="1526" y="293" text-anchor="middle" class="label" fill="#1D4ED8">TCP :9999</text><text x="1526" y="315" text-anchor="middle" class="tiny">명령 ↔ 상태</text>
  <path d="M1420 670 H1535 V483 H1630" fill="none" stroke="#7C3AED" stroke-width="4" marker-end="url(#purpleArrow)"/><path d="M1630 525 H1560 V710 H1420" fill="none" stroke="#7C3AED" stroke-width="4" marker-end="url(#purpleArrow)"/><rect x="1463" y="574" width="132" height="68" rx="12" fill="#F5F3FF" stroke="#DDD6FE"/><text x="1529" y="598" text-anchor="middle" class="label" fill="#6D28D9">지도 bundle</text><text x="1529" y="620" text-anchor="middle" class="tiny">PGM/YAML/pose</text><text x="1529" y="637" text-anchor="middle" class="tiny">TCP :9999 경유</text>
  <path d="M1830 1235 V1405 H270 V1235" fill="none" stroke="#16A34A" stroke-width="4" marker-end="url(#greenArrow)"/><rect x="830" y="1384" width="440" height="58" rx="14" fill="#F0FDF4" stroke="#86EFAC"/><text x="1050" y="1407" text-anchor="middle" class="label" fill="#15803D">로봇 → 앱 직접 영상 · HTTP :8080 /stream.mjpg</text><text x="1050" y="1429" text-anchor="middle" class="tiny">Ubuntu 서버를 경유하지 않음 · 현재 인증/TLS 없음</text>
  <text x="40" y="1450" class="tiny muted">OrchardX · 프로젝트 실제 구현 기준 아키텍처</text><text x="2060" y="1450" text-anchor="end" class="tiny muted">운영 서버 관측 + 저장소 구현 기준</text>
</svg>
